<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Story</title>
<style>
  *{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;background:#000;overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;color:#fff;}
  body{display:grid;place-items:center;}

  .phone{position:relative;width:100vw;height:100dvh;overflow:hidden;}
  @media (min-width:600px){
    .phone{width:min(100vw,calc(100dvh*9/16));height:min(100dvh,calc(100vw*16/9));border-radius:22px;}
  }

  /* 動画をヨコに並べたレール。これを translateX で動かす */
  .track{display:flex;height:100%;}
  .track.anim{transition:transform .3s cubic-bezier(.22,.61,.36,1);}
  .track video{flex:0 0 100%;width:100%;height:100%;object-fit:cover;background:#000;}

  /* 上のバー */
  .top{position:absolute;top:0;left:0;right:0;padding:calc(10px + env(safe-area-inset-top)) 12px 0;
    background:linear-gradient(rgba(0,0,0,.5),transparent);}
  .bars{display:flex;gap:3px;height:2.5px;}
  .bars div{flex:1;border-radius:2px;background:rgba(255,255,255,.35);overflow:hidden;}
  .bars i{display:block;height:100%;width:0;background:#fff;}
  .head{display:flex;align-items:center;gap:9px;padding:11px 2px 0;font-size:13px;}
  .ava{width:32px;height:32px;border-radius:50%;
    background:conic-gradient(from 200deg,#f9ce34,#ee2a7b,#6228d7,#f9ce34);}
  .head b{font-weight:600;}
  .head span{color:rgba(255,255,255,.55);}

  /* 下のバー */
  .bottom{position:absolute;bottom:0;left:0;right:0;display:flex;align-items:center;gap:10px;
    padding:12px 12px calc(12px + env(safe-area-inset-bottom));
    background:linear-gradient(transparent,rgba(0,0,0,.55));}
  .msg{flex:1;height:42px;padding:0 16px;border:1px solid rgba(255,255,255,.65);border-radius:21px;
    background:transparent;color:#fff;font:inherit;font-size:14px;outline:none;}
  .msg::placeholder{color:rgba(255,255,255,.8);}
  .btn{width:42px;height:42px;border:0;background:none;padding:0;display:grid;place-items:center;}
  .btn svg{width:26px;height:26px;fill:none;stroke:#fff;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
  .btn.on svg{fill:#ff2d55;stroke:#ff2d55;}
</style>
</head>
<body>

<div class="phone">
  <div class="track" id="track"></div>

  <div class="top">
    <div class="bars" id="bars"></div>
    <div class="head"><div class="ava"></div><b>my_story</b><span>3時間前</span></div>
  </div>

  <div class="bottom">
    <input class="msg" placeholder="メッセージを送信">
    <button class="btn" id="like" aria-label="いいね">
      <svg viewBox="0 0 24 24"><path d="M12 20.5S3.5 14.9 3.5 9.3A4.8 4.8 0 0 1 12 6.4a4.8 4.8 0 0 1 8.5 2.9c0 5.6-8.5 11.2-8.5 11.2Z"/></svg>
    </button>
    <button class="btn" aria-label="拡散">
      <svg viewBox="0 0 24 24"><path d="M21.5 2.5 2.8 9.6l6.6 2.4 2.4 6.6 9.7-16.1Z"/><path d="M9.4 12 21.5 2.5"/></svg>
    </button>
  </div>
</div>

<script>
// ▼ 差し替えるのはここだけ。この HTML と同じ場所に置いた動画のファイル名。
const VIDEOS = ['1.mp4', '2.mp4', '3.mp4'];

const track = document.getElementById('track');
const bars  = document.getElementById('bars');
let i = 0;

VIDEOS.forEach((src, n) => {
  const v = document.createElement('video');
  v.src = src; v.muted = true; v.playsInline = true; v.preload = 'auto';  // 音を出すなら muted を false に
  v.ontimeupdate = () => { if (n === i && v.duration) bar(n, v.currentTime / v.duration); };
  v.onended = () => { if (n === i) go(i + 1); };
  track.append(v);
  bars.insertAdjacentHTML('beforeend', '<div><i></i></div>');
});

const bar = (n, r) => bars.children[n].firstChild.style.width = Math.min(1, r) * 100 + '%';

function go(n){
  n = (n + VIDEOS.length) % VIDEOS.length;      // 端まで行ったら最初に戻る
  track.children[i].pause();
  i = n;
  track.classList.add('anim');
  track.style.transform = `translateX(${-i * 100}%)`;
  [...bars.children].forEach((s, k) => bar(k, k < i ? 1 : 0));
  const v = track.children[i];
  v.currentTime = 0;
  v.play().catch(() => {});
}

// 横スワイプ
let x0 = null;
track.parentElement.onpointerdown = e => {
  if (e.target.closest('.bottom')) return;
  x0 = e.clientX; track.classList.remove('anim');
};
track.parentElement.onpointermove = e => {
  if (x0 === null) return;
  track.style.transform = `translateX(calc(${-i * 100}% + ${e.clientX - x0}px))`;
};
track.parentElement.onpointerup = e => {
  if (x0 === null) return;
  const dx = e.clientX - x0;
  x0 = null;
  go(Math.abs(dx) > 60 ? i + (dx < 0 ? 1 : -1) : i);
};

document.getElementById('like').onclick = e => e.currentTarget.classList.toggle('on');
onkeydown = e => { if (e.key === 'ArrowRight') go(i + 1); if (e.key === 'ArrowLeft') go(i - 1); };

go(0);
</script>
</body>
</html>
